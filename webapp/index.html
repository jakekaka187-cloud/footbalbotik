<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0118">
  <title>ЧМ 2026 Мини-игры</title>
  <link rel="stylesheet" href="/webapp/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- ══════════════ MAIN SCREEN ══════════════ -->
  <div id="screen-main" class="screen">
    <div class="main-header">
      <span class="trophy-emoji">🏆</span>
      <h1>ЧМ 2026</h1>
      <p>Мини-игры</p>
    </div>

    <div class="games-grid">
      <div class="game-card card-legends" onclick="showGame('legends')">
        <span class="card-icon">🏆</span>
        <div class="card-title">Легенды ЧМ</div>
        <div class="card-desc">Угадай легенду по подсказкам</div>
      </div>

      <div class="game-card card-national" onclick="showGame('national')">
        <span class="card-icon">🌍</span>
        <div class="card-title">Угадай сборную</div>
        <div class="card-desc">По составу клубов</div>
      </div>

      <div class="game-card card-trophy" onclick="showGame('trophy')">
        <span class="card-icon">🛤️</span>
        <div class="card-text">
          <div class="card-title">Путь к трофею</div>
          <div class="card-desc">Узнай чемпиона по матчам на турнире</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <span class="user-name" id="user-name">👋 Игрок</span>
      <span class="score-tag">⚽ Зарабатывай очки!</span>
    </div>
  </div>

  <!-- ══════════════ GAME SCREEN ══════════════ -->
  <div id="screen-game" class="screen">
    <!-- Filled dynamically by app.js -->
  </div>

  <!-- ══════════════ RESULT SCREEN ══════════════ -->
  <div id="screen-result" class="screen">
    <!-- Filled dynamically by app.js -->
  </div>

  <!-- Data -->
  <script src="/webapp/data/legends_data.js"></script>
  <script src="/webapp/data/national_data.js"></script>
  <script src="/webapp/data/trophy_data.js"></script>
  <script src="/webapp/games/legends.js"></script>
  <script src="/webapp/games/national.js"></script>
  <script src="/webapp/games/trophy.js"></script>
  <script src="/webapp/app.js"></script>
</body>
</html>
